<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VINTONE Binder</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./src/state.js"></script>
    <script src="./src/binder/layer-shape.js"></script>
    <script src="./src/binder/document-model.js"></script>
    <script src="./src/ui/components.js"></script>
    <script src="./src/ui/bind-status.js"></script>
    <script src="./src/main.js"></script>
  </head>
  <body>
    <main id="app" class="panel">
      <header class="panel-header">
        <h1>VINTONE Binder</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <section id="bind-status" class="status status-unknown">Waiting for Photoshop document...</section>
      <section class="section">
        <h2>Detected Anchors</h2>
        <ul id="anchor-list" class="anchor-list"></ul>
      </section>
      <section class="section">
        <h2>Safety</h2>
        <p id="safety-note">Read-only binder. No edits, saves, exports, or layer changes are performed here.</p>
      </section>
    </main>
  </body>
</html>
